<!-- ASSISTENTE SUZI -->
<div id="suzi">
  <div class="suzi-personagem">
    <img src="images/suzi.gif" alt="Suzi - Assistente Virtual">
    <span class="suzi-ola">Olá! 💗</span>
  </div>

  <button id="suzi-toggle" aria-label="Conversar com a Suzi">
    💬 Falar com a Suzi
  </button>
</div>

<div id="suzi-chat">
  <div class="suzi-topo">
    <strong>Suzi | Lash Studio 💗</strong>
    <button id="suzi-close" aria-label="Fechar">×</button>
  </div>

  <div id="suzi-messages">
    <p>Oi, linda! Sou a Suzi! 💕 Como posso te ajudar?</p>
  </div>

  <form id="suzi-form">
    <input id="suzi-input" placeholder="Digite sua mensagem..." required>
    <button type="submit">Enviar</button>
  </form>
</div>
